<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <div class="calculator">
            <form name="form">
                
                <div class="display">
                    <input type="text" name="display" readonly />
                </div>

                <div>
                    <input type="button" value="AC" onclick="form.display.value=''" class="operator" />
                    <input type="button" value="DEL" onclick="form.display.value=form.display.value.slice(0,-1)" class="operator" />
                    <input type="button" value="." onclick="form.display.value+='.'" />
                    <input type="button" value="/" onclick="form.display.value+='/'" class="operator" />
                </div>

                <div>
                    <input type="button" value="7" onclick="form.display.value+='7'" />
                    <input type="button" value="8" onclick="form.display.value+='8'" />
                    <input type="button" value="9" onclick="form.display.value+='9'" />
                    <input type="button" value="*" onclick="form.display.value+='*'" class="operator" />
                </div>

                <div>
                    <input type="button" value="4" onclick="form.display.value+='4'" />
                    <input type="button" value="5" onclick="form.display.value+='5'" />
                    <input type="button" value="6" onclick="form.display.value+='6'" />
                    <input type="button" value="-" onclick="form.display.value+='-'" class="operator" />
                </div>

                <div>
                    <input type="button" value="1" onclick="form.display.value+='1'" />
                    <input type="button" value="2" onclick="form.display.value+='2'" />
                    <input type="button" value="3" onclick="form.display.value+='3'" />
                    <input type="button" value="+" onclick="form.display.value+='+'" class="operator" />
                </div>

                <div>
                    <input type="button" value="0" onclick="form.display.value+='0'" />
                    <input type="button" value="00" onclick="form.display.value+='00'" />
                    <input type="button" value="000" onclick="form.display.value+='000'" />
                    <input type="button" value="=" onclick="form.display.value=eval(form.display.value)" class="equal operator" />
                </div>

            </form>
        </div>
    </div>
</body>
</html>
